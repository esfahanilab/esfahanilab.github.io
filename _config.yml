title: Esfahani Lab
tagline: Computational Oncology · Stanford Medicine
description: >-
  The Esfahani Lab at Stanford Radiation Oncology develops statistical and
  machine-learning methods to reconstruct the identity, state, and history of
  cells from the molecular traces they leave behind — and to recognize and
  change the trajectory of emerging and residual cancer.

