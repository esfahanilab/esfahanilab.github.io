# ── People ─────────────────────────────────────────────────────────────────────
# To add someone: copy a block, drop a 600×600 photo in assets/img/people/,
# and set `photo` to the file name. Groups: pi, postdoc, student, staff, alumni.
# Members are shown in the order listed. Alumni are grouped separately.

- name: Mohammad Shahrokh Esfahani, PhD
  group: pi
  role: Principal Investigator
  title: Assistant Professor of Radiation Oncology (Radiation and Cancer Biology)
  photo: esfahani.jpg
  email: shahrokh@stanford.edu
  links:
    - { label: Stanford Profile, url: "https://profiles.stanford.edu/mohammad-shahrokh-esfahani" }
    - { label: Google Scholar,   url: "https://scholar.google.com/citations?user=3LpGRA8AAAAJ&hl=en" }
  bio: >-
    Mohammad is a computational scientist working at the intersection of
    machine learning, Bayesian statistics, and cancer genomics. He led the
    development of EPIC-Seq, which infers tumor gene expression from the
    fragmentation patterns of cell-free DNA, and his group develops methods that
    recover weak biological signals from noisy, high-dimensional assays. He
    started the lab in Stanford's Department of Radiation Oncology in March 2024.

- name: Amirsaman Ashtari, PhD
  group: postdoc
  role: Postdoctoral Scholar
  since: Sept 2024
  photo: ashtari.jpg
  email: aashtari@stanford.edu
  bio: >-
    Amirsaman trained in AI for computer vision and graphics during his PhD at
    KAIST and ETH Zürich, where he received a Young Researcher Award. In the
    lab he builds deep-learning models that dissect tumor gene expression and
    the tumor microenvironment from cell-free DNA and targeted sequencing data.

- name: Junming (Seraphina) Shi, PhD
  group: postdoc
  role: Postdoctoral Scholar
  since: Feb 2025
  photo: shi.jpg
  email: junmings@stanford.edu
  bio: >-
    Seraphina is co-mentored by Mohammad Shahrokh Esfahani and Md Tauhidul Islam. She
    works on patient-centered, high-dimensional, multimodal data, including
    imaging-based spatial proteomics of lymphoma, to understand how malignant
    cells and their neighbors organize in tissue.

- name: Alexander Köpp, MD
  group: postdoc
  role: Postdoctoral Scholar
  since: Oct 2026
  photo: koepp.jpg
  email: akoepp@stanford.edu
  bio: >-
    Alex is a postdoctoral fellow at Stanford and a physician-scientist in the
    Department of Neurology at the University Hospital Zurich. He was
    previously a postdoctoral researcher at ETH Zurich, supported by an ETH
    MedLab Fellowship. His research focuses on liquid biopsies and
    immunotherapies for brain cancer, particularly glioblastoma, and aims to
    leverage high-dimensional molecular and clinical data to improve diagnosis
    and care for patients.

- name: Ananya Pradhan
  group: student
  role: Undergraduate Researcher
  since: Aug 2025
  photo: pradhan.jpg
  bio: >-
    Ananya is a first-year undergraduate at UC Berkeley. She joined the lab as
    a high school student at The Harker School through the SIMR program, and
    received the Jessica Saal Award for her 2025 SIMR project. Her research
    sits at the intersection of deep learning, computational analysis, and
    high-dimensional biological data.

- name: Michelle Ly
  group: staff
  role: Administrative Associate
  photo: ly.jpg
  email: mly00@stanford.edu
  bio: >-
    Michelle provides administrative support to the lab within the Department
    of Radiation Oncology.

