<header class="site-header" data-header>
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="32" height="32"><use href="#mark"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">Esfahani Lab</span>
        <span class="brand-sub">Computational Oncology · Stanford Medicine</span>
      </span>
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
      <span class="sr-only">Menu</span>
      <span class="nav-toggle-bar"></span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="Primary">
      <ul>
        {% for item in site.nav %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="mark" viewBox="0 0 32 32">
      <!-- three cfDNA fragments: a nucleosome-wrapped core with linker tails -->
      <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <path d="M3 9h8"/><circle cx="16" cy="9" r="3.2"/><path d="M21 9h8"/>
        <path d="M3 16h4"/><circle cx="12" cy="16" r="3.2"/><path d="M17 16h12"/>
        <path d="M3 23h12"/><circle cx="20" cy="23" r="3.2" class="mark-accent"/><path d="M25 23h4"/>
      </g>
    </symbol>
  </defs>
</svg>
